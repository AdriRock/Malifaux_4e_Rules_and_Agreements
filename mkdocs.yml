site_name: Malifaux Community Rulings
site_description: Официальные разъяснения, RAW-анализ и локальные договорённости по Malifaux 4E
site_url: https://adrirock.github.io/Malifaux_4e_Rules_and_Agreements/
repo_url: https://github.com/AdriRock/Malifaux_4e_Rules_and_Agreements
repo_name: AdriRock/Malifaux_4e_Rules_and_Agreements
docs_dir: docs
theme:
  name: material
  language: ru
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
plugins:
  - search:
      lang:
        - ru
        - en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Главная: index.md
  - Проверьте карточки:
      - Быстрая памятка: card-overrides/index.md
      - Читать по FAQ: card-overrides/faq-required.md
      - Включено в Errata: card-overrides/errata-incorporated.md
      - Архив: card-overrides/archive.md
  - Разъяснения:
      - Обзор: rulings/index.md
      - Официальные:
          - Обзор: rulings/official/index.md
          - Общие правила: rulings/official/general.md
          - Actions: rulings/official/actions.md
          - Terrain: rulings/official/terrain.md
          - Encounters: rulings/official/encounters.md
          - Abilities, Actions и Triggers: rulings/official/specific-abilities.md
          - Arcanists: rulings/official/arcanists.md
          - Bayou: rulings/official/bayou.md
          - Explorer's Society: rulings/official/explorers-society.md
          - Guild: rulings/official/guild.md
          - Neverborn: rulings/official/neverborn.md
          - Outcasts: rulings/official/outcasts.md
          - "Tara, Voidcaller — Adrift In Time": rulings/official/tara-voidcaller-adrift-in-time.md
          - Resurrectionists: rulings/official/resurrectionists.md
          - Ten Thunders: rulings/official/ten-thunders.md
          - Campaign: rulings/official/campaign.md
          - Исправления карточек:
              - Sidir Archibal — Mortar Strike: rulings/official/card-overrides/sidir-archibal-mortar-strike.md
              - Winston Finnigan — Won Over: rulings/official/card-overrides/winston-finnigan-won-over.md
              - Titania — Those Who Consume the Land: rulings/official/card-overrides/titania-those-who-consume-the-land.md
              - Stifling Thicket — Gift of the Queen: rulings/official/card-overrides/stifling-thicket-gift-of-the-queen.md
              - Corpse Curator — Control Graft: rulings/official/card-overrides/corpse-curator-control-graft.md
              - Kara — Catlike Reflexes: rulings/official/card-overrides/kara-catlike-reflexes.md
              - Kara — Springing Strike: rulings/official/card-overrides/kara-springing-strike.md
              - Fall Into Darkness: rulings/official/card-overrides/fall-into-darkness.md
          - Архив снятых пунктов June 2026: rulings/official/archive/faq-june-2026-not-current-online.md
      - RAW: rulings/raw/index.md
      - Договорённости сообщества: rulings/community/index.md
      - Спорные вопросы: rulings/disputed/index.md
      - Шаблон записи: rulings/template.md
  - Модели:
      - Обзор: models/index.md
      - Arcanists: models/arcanists/index.md
      - Bayou: models/bayou/index.md
      - Explorer's Society:
          - Обзор: models/explorers-society/index.md
          - Sidir Archibal: models/explorers-society/sidir-archibal.md
          - Winston Finnigan: models/explorers-society/winston-finnigan.md
      - Guild: models/guild/index.md
      - Neverborn:
          - Обзор: models/neverborn/index.md
          - Titania: models/neverborn/titania.md
      - Outcasts:
          - Обзор: models/outcasts/index.md
          - "Tara, Voidcaller": models/outcasts/tara-voidcaller.md
      - Resurrectionists:
          - Обзор: models/resurrectionists/index.md
          - Corpse Curator: models/resurrectionists/corpse-curator.md
      - Ten Thunders:
          - Обзор: models/ten-thunders/index.md
          - Kara: models/ten-thunders/kara.md
  - Банды:
      - Обзор: crews/index.md
      - Arcanists: crews/arcanists/index.md
      - Bayou: crews/bayou/index.md
      - Explorer's Society: crews/explorers-society/index.md
      - Guild: crews/guild/index.md
      - Neverborn:
          - Обзор: crews/neverborn/index.md
          - Stifling Thicket: crews/neverborn/stifling-thicket.md
      - Outcasts: crews/outcasts/index.md
      - Resurrectionists: crews/resurrectionists/index.md
      - Ten Thunders: crews/ten-thunders/index.md
  - Общие правила:
      - Обзор: rules/index.md
      - Активации: rules/activation.md
  - Источники:
      - Обзор: sources/index.md
      - Онлайн-FAQ — 2026-10-10: sources/faq-online-2026-10-10.md
      - FAQ June 2026: sources/faq-june-2026.md
  - О проекте:
      - Статусы: about/statuses.md
      - Методология: about/methodology.md
      - Как помочь: about/contributing.md
